name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test -- --run

      # pkg.pr.new publishes a preview tarball to its own npm-compatible URL.
      # It does not touch the npm registry. The GitHub App must be installed.
      - name: Publish PR preview
        if: github.event_name == 'pull_request'
        run: pnpm exec pkg-pr-new publish --pnpm --bin --previewVersion --commentWithSha .
