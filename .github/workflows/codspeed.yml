name: codspeed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows CodSpeed backfills to create the initial history.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OIDC authentication with CodSpeed. No static token secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm bench
